<!-- Device Setup add-on: injected into tracfone_web_ui.html by tracfone_web_ui_devsetup.py -->
<style>
/* device_config_panel.css — all selectors are prefixed dc- so nothing in the
   existing console is affected. Tone (dark/light) is set from JS by reading the page. */
.dc-overlay{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) 16px 16px;background:rgba(6,5,3,.62);backdrop-filter:blur(6px);
  font-family:inherit}
.dc-overlay[hidden]{display:none}
.dc-overlay[data-tone="dark"]{--bg:rgba(20,16,9,.97);--fg:#f6ecd0;--muted:#bfae82;--line:rgba(226,190,100,.38);
  --field:#0d0a05;--accent:var(--gold,#e2be64);--log:#070604;--ok:#7bd88f;--warn:#f0b64a;--bad:#ff8a7a;--cmd:#e8d9a8}
.dc-overlay[data-tone="light"]{--bg:rgba(255,251,240,.98);--fg:#2a2210;--muted:#7a6a3e;--line:rgba(150,115,30,.45);
  --field:#fffdf6;--accent:var(--gold,#a8760a);--log:#fbf6e4;--ok:#1d7a39;--warn:#946100;--bad:#b3261e;--cmd:#4a3a12}
.dc-panel{width:min(980px,100%);max-height:min(720px,100%);display:flex;flex-direction:column;color:var(--fg);
  background:var(--bg);border:1.5px solid var(--line);border-radius:22px;
  box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);
  animation:dc-in .18s ease-out}
@keyframes dc-in{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.dc-head{display:flex;justify-content:space-between;gap:16px;padding:20px 24px 14px;border-bottom:1px solid var(--line)}
.dc-head h2{margin:0;font-size:1.35rem;letter-spacing:.01em}
.dc-head p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.dc-x{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;
  color:var(--fg);font-size:1.3rem;cursor:pointer}
.dc-body{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:20px;padding:18px 24px 22px;min-height:0;flex:1}
.dc-form{display:flex;flex-direction:column;gap:14px;min-width:0}
.dc-field>label,.dc-field>.dc-lbl{display:block;margin-bottom:6px;font-weight:600;font-size:.92rem}
.dc-field small{display:block;margin-top:6px;color:var(--muted);font-size:.82rem;line-height:1.35}
.dc-row{display:flex;gap:8px}
.dc-overlay select,.dc-overlay input[type=text],.dc-overlay input[type=number]{width:100%;min-width:0;box-sizing:border-box;
  padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--fg);font:inherit}
.dc-overlay select:focus-visible,.dc-overlay input:focus-visible,.dc-overlay button:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.dc-choices{display:flex;flex-direction:column;gap:6px}
.dc-choice{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;
  background:var(--field);cursor:pointer}
.dc-choice:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.dc-pill{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);
  font-size:.75rem;color:var(--accent);vertical-align:middle}
.dc-warn{margin:0;padding:10px 12px;border-radius:12px;border:1px solid var(--warn);color:var(--warn);font-size:.86rem;line-height:1.4}
.dc-warn.dc-wipe{border-color:var(--bad);color:var(--bad)}
.dc-actions{display:flex;gap:10px;margin-top:2px}
.dc-btn{padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);
  font:inherit;font-weight:600;cursor:pointer}
.dc-btn:disabled{opacity:.45;cursor:not-allowed}
.dc-ghost{padding:11px 13px}
.dc-run{flex:1;border:0;color:#fff;background:linear-gradient(#5f82ff,#3556d8);box-shadow:0 6px 18px rgba(53,86,216,.38)}
.dc-run.dc-armed{background:linear-gradient(#e0584a,#b32d22);box-shadow:0 6px 18px rgba(179,45,34,.4)}
.dc-stop{color:var(--bad);border-color:var(--bad)}
.dc-logwrap{display:flex;flex-direction:column;min-height:260px;min-width:0}
.dc-logbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.dc-logbar .dc-btn{padding:6px 12px;font-size:.82rem}
.dc-status{font-size:.95rem}
.dc-status[data-s=running]{color:var(--accent)}.dc-status[data-s=done]{color:var(--ok)}
.dc-status[data-s=warn]{color:var(--warn)}.dc-status[data-s=error],.dc-status[data-s=stopped]{color:var(--bad)}
.dc-log{flex:1;margin:0;padding:14px;overflow:auto;border-radius:14px;border:1px solid var(--line);background:var(--log);
  font:.84rem/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;min-height:200px}
.dc-log .dc-cmd{color:var(--cmd)}.dc-log .dc-ok{color:var(--ok)}.dc-log .dc-wn{color:var(--warn)}.dc-log .dc-er{color:var(--bad)}
.dc-log .dc-empty{color:var(--muted)}
.dc-fab{position:fixed;right:20px;bottom:84px;z-index:8000;padding:11px 18px;border-radius:999px;border:1px solid var(--dc-line,#c9a24a);
  background:#17130b;color:#f6ecd0;font:inherit;font-weight:600;cursor:pointer}
@media (max-width:760px){.dc-body{grid-template-columns:1fr;overflow:auto}.dc-panel{max-height:100%}}
@media (prefers-reduced-motion:reduce){.dc-panel{animation:none}}

</style>
<script>
/* device_config_panel.js — adds a "Device Setup" button to the top nav and a panel
   for carrier / SKU / SIM / radio / erase / setup-wizard / battery / reboot actions.
   Self-contained: no globals except window.__devcfgLoaded, never touches scenario code. */
(function () {
  'use strict';
  if (window.__devcfgLoaded) return;
  window.__devcfgLoaded = true;

  var API = '/api/devcfg';
  var S = { actions: [], devices: [], serial: '', action: '', job: null, since: 0,
            pollT: null, devT: null, armed: false, armT: null, errors: [], opener: null };
  var ov, q;

  function api(path, opts) {
    return fetch(API + path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.error || ('Request failed (' + r.status + ')'));
        return d;
      });
    });
  }
  function post(path, body) {
    return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }
  function $(name) { return ov.querySelector('[data-dc="' + name + '"]'); }
  function curAction() { return S.actions.filter(function (a) { return a.label === S.action; })[0]; }
  function curDevice() { return S.devices.filter(function (d) { return d.serial === S.serial; })[0]; }

  /* ---------- build ---------- */
  function build() {
    ov = document.createElement('div');
    ov.className = 'dc-overlay';
    ov.hidden = true;
    ov.innerHTML =
      '<section class="dc-panel" role="dialog" aria-modal="true" aria-labelledby="dc-title">' +
      '<header class="dc-head"><div><h2 id="dc-title">Device setup</h2>' +
      '<p>Change carrier, SKU, SIM, radio and reboot modes over fastboot or ADB.</p></div>' +
      '<button class="dc-x" data-dc="close" aria-label="Close device setup">\u00d7</button></header>' +
      '<div class="dc-body"><div class="dc-form">' +
      '<div class="dc-field"><label for="dc-device">Device<span class="dc-pill" data-dc="mode" hidden></span></label>' +
      '<div class="dc-row"><select id="dc-device" data-dc="device"></select>' +
      '<button class="dc-btn dc-ghost" data-dc="refresh" title="Refresh devices" aria-label="Refresh devices">\u27f3</button></div>' +
      '<small data-dc="devnote"></small></div>' +
      '<div class="dc-field"><label for="dc-action">Action</label><select id="dc-action" data-dc="action"></select></div>' +
      '<div class="dc-field" data-dc="value"></div>' +
      '<p class="dc-warn" data-dc="warn" hidden></p>' +
      '<div class="dc-actions"><button class="dc-btn dc-run" data-dc="run">Run</button>' +
      '<button class="dc-btn dc-stop" data-dc="stop" disabled>Stop</button></div></div>' +
      '<div class="dc-logwrap"><div class="dc-logbar"><strong class="dc-status" data-dc="status" data-s="idle">Idle</strong>' +
      '<span><button class="dc-btn" data-dc="copy">Copy log</button> <button class="dc-btn" data-dc="clear">Clear</button></span></div>' +
      '<pre class="dc-log" data-dc="log" aria-live="polite"></pre></div></div></section>';
    document.body.appendChild(ov);

    ov.addEventListener('mousedown', function (e) { if (e.target === ov) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !ov.hidden) close(); });
    $('close').onclick = close;
    $('refresh').onclick = loadDevices;
    $('device').onchange = function () { S.serial = this.value; afterDeviceChange(); };
    $('action').onchange = function () { S.action = this.value; disarm(); renderValue(); renderWarn(); updateButtons(); };
    $('run').onclick = onRun;
    $('stop').onclick = onStop;
    $('clear').onclick = function () { $('log').textContent = ''; showEmpty(); };
    $('copy').onclick = function () { if (navigator.clipboard) navigator.clipboard.writeText($('log').innerText); };
    showEmpty();
  }

  /* ---------- tone follows the page ---------- */
  function tone() {
    function lum(c) {
      var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/.exec(c || '');
      if (!m || (m[4] !== undefined && parseFloat(m[4]) === 0)) return null;
      return (0.299 * m[1] + 0.587 * m[2] + 0.114 * m[3]) / 255;
    }
    var th = document.documentElement.dataset.theme;
    if (th === 'light' || th === 'dark') { ov.setAttribute('data-tone', th); return; }
    var l = lum(getComputedStyle(document.body).backgroundColor);
    if (l === null) l = lum(getComputedStyle(document.documentElement).backgroundColor);
    ov.setAttribute('data-tone', l !== null && l > 0.6 ? 'light' : 'dark');
  }

  /* ---------- open / close ---------- */
  function open() {
    if (!ov) build();
    S.opener = document.activeElement;
    tone();
    ov.hidden = false;
    Promise.all([S.actions.length ? 0 : loadActions(), loadDevices()]).then(function () { $('device').focus(); });
    S.devT = setInterval(loadDevices, 5000);
  }
  function close() {
    ov.hidden = true;
    clearInterval(S.devT);
    if (S.opener && S.opener.focus) S.opener.focus();
  }

  /* ---------- data ---------- */
  function loadActions() {
    return api('/actions').then(function (d) { S.actions = d.actions; renderActions(); })
      .catch(function (e) { setStatus(e.message, 'error'); });
  }
  function loadDevices() {
    return api('/devices').then(function (d) {
      S.devices = d.devices; S.errors = d.errors || [];
      renderDevices();
    }).catch(function (e) { S.errors = [e.message]; renderDevices(); });
  }

  /* ---------- render ---------- */
  function renderDevices() {
    var sel = $('device'), keep = S.serial;
    sel.innerHTML = '';
    if (!S.devices.length) {
      var o = document.createElement('option'); o.textContent = 'No device detected'; o.value = ''; sel.appendChild(o);
    }
    S.devices.forEach(function (d) {
      var o = document.createElement('option');
      o.value = d.serial; o.textContent = d.serial + '  \u2022  ' + d.mode; sel.appendChild(o);
    });
    S.serial = S.devices.some(function (d) { return d.serial === keep; }) ? keep : (S.devices[0] ? S.devices[0].serial : '');
    sel.value = S.serial;
    afterDeviceChange();
  }
  function afterDeviceChange() {
    var d = curDevice(), pill = $('mode'), note = $('devnote');
    pill.hidden = !d; if (d) pill.textContent = d.mode;
    if (S.errors.length) note.textContent = S.errors.join('. ') + '.';
    else if (!d) note.textContent = 'Connect the phone with USB debugging on, or boot it to fastboot, then refresh.';
    else if (d.mode === 'UNAUTHORIZED') note.textContent = 'Accept the USB debugging prompt on the phone, then refresh.';
    else if (!d.ready) note.textContent = 'This device is ' + d.mode.toLowerCase() + ' and cannot take commands yet.';
    else note.textContent = '';
    if (d && d.job_id && !S.job) attach(d.job_id);        // resume a task after page reload
    renderActions();
  }
  function renderActions() {
    var sel = $('action'), d = curDevice();
    var list = S.actions.filter(function (a) { return !d || !d.ready || a.modes.indexOf(d.mode) !== -1; });
    sel.innerHTML = '';
    list.forEach(function (a) {
      var o = document.createElement('option'); o.value = a.label; o.textContent = a.label; sel.appendChild(o);
    });
    if (!list.some(function (a) { return a.label === S.action; })) { S.action = list[0] ? list[0].label : ''; disarm(); }
    sel.value = S.action;
    renderValue(); renderWarn(); updateButtons();
  }
  function renderValue() {
    var a = curAction(), box = $('value'); box.innerHTML = '';
    if (!a || a.kind === 'none') return;
    var lbl = document.createElement('span'); lbl.className = 'dc-lbl'; lbl.textContent = a.prompt || 'Value'; box.appendChild(lbl);
    if (a.kind === 'choice') {
      var wrap = document.createElement('div'); wrap.className = 'dc-choices'; wrap.setAttribute('role', 'radiogroup');
      a.options.forEach(function (opt, i) {
        var l = document.createElement('label'); l.className = 'dc-choice';
        var r = document.createElement('input'); r.type = 'radio'; r.name = 'dc-opt'; r.value = opt;
        r.checked = !a.explicit_choice && i === 0;
        l.appendChild(r); l.appendChild(document.createTextNode(opt)); wrap.appendChild(l);
      });
      box.appendChild(wrap);
    } else {
      var inp = document.createElement('input');
      inp.type = a.kind === 'number' ? 'number' : 'text';
      inp.setAttribute('data-dc', 'param'); inp.maxLength = 64; inp.autocomplete = 'off';
      if (a.kind === 'number') { inp.min = a.min; inp.max = a.max; inp.step = 1; }
      inp.setAttribute('aria-label', a.prompt || 'Value');
      inp.oninput = disarm;
      box.appendChild(inp);
    }
  }
  function renderWarn() {
    var a = curAction(), w = $('warn');
    w.hidden = !(a && a.warn);
    if (a && a.warn) { w.textContent = a.warn; w.classList.toggle('dc-wipe', !!a.wipes); }
  }
  function getParam() {
    var a = curAction(); if (!a || a.kind === 'none') return null;
    if (a.kind === 'choice') { var r = ov.querySelector('input[name="dc-opt"]:checked'); return r ? r.value : ''; }
    var i = $('param'); return i ? i.value.trim() : '';
  }
  function updateButtons() {
    var d = curDevice(), a = curAction();
    $('run').disabled = !(d && d.ready && a) || !!S.job;
    $('stop').disabled = !S.job;
  }

  /* ---------- run / stop ---------- */
  function disarm() {
    S.armed = false; clearTimeout(S.armT);
    var b = $('run'); b.classList.remove('dc-armed'); b.textContent = 'Run';
  }
  function onRun() {
    var a = curAction(), p = getParam();
    if (a.kind !== 'none' && !p) { setStatus(a.kind === 'choice' ? 'Choose an option first.' : 'Enter a value first.', 'error'); return; }
    if (a.warn && !S.armed) {
      S.armed = true;
      var b = $('run'); b.classList.add('dc-armed'); b.textContent = 'Click again to confirm';
      S.armT = setTimeout(disarm, 5000);
      return;
    }
    disarm();
    post('/run', { serial: S.serial, action: a.label, param: p }).then(function (r) {
      $('log').textContent = ''; attach(r.job_id);
    }).catch(function (e) { appendLine('[ERROR] ' + e.message); setStatus(e.message, 'error'); });
  }
  function onStop() {
    $('stop').disabled = true;
    post('/stop', { serial: S.serial }).catch(function (e) { appendLine('[ERROR] ' + e.message); });
  }

  /* ---------- job polling ---------- */
  function attach(id) {
    S.job = id; S.since = 0; $('log').textContent = '';
    setStatus('Running\u2026', 'running'); updateButtons();
    clearInterval(S.pollT); S.pollT = setInterval(poll, 700); poll();
  }
  var LABEL = { running: 'Running\u2026', done: 'Finished', warn: 'Finished with errors \u2014 check the log',
                error: 'Failed', stopped: 'Stopped' };
  function poll() {
    if (!S.job) return;
    api('/job?id=' + encodeURIComponent(S.job) + '&since=' + S.since).then(function (d) {
      d.lines.forEach(appendLine); S.since = d.next;
      setStatus(LABEL[d.status] || d.status, d.status);
      if (d.status !== 'running') { endJob(); loadDevices(); }
    }).catch(function (e) { setStatus(e.message, 'error'); endJob(); });
  }
  function endJob() { clearInterval(S.pollT); S.job = null; updateButtons(); }

  /* ---------- log ---------- */
  function showEmpty() {
    var s = document.createElement('span'); s.className = 'dc-empty'; s.textContent = 'Output from the selected action appears here.';
    $('log').appendChild(s);
  }
  function appendLine(t) {
    var log = $('log'), e = log.querySelector('.dc-empty'); if (e) e.remove();
    var s = document.createElement('div');
    if (/^\$ /.test(t)) s.className = 'dc-cmd';
    else if (/\[ERROR\]|FAILED|\u274c/i.test(t)) s.className = 'dc-er';
    else if (/\u2705/.test(t)) s.className = 'dc-ok';
    else if (/\u26a0/.test(t)) s.className = 'dc-wn';
    s.textContent = t; log.appendChild(s);
    log.scrollTop = log.scrollHeight;
  }
  function setStatus(text, state) {
    var s = $('status'); if (!s) return; s.textContent = text; s.setAttribute('data-s', state || 'idle');
  }

  /* ---------- nav button (clones the Settings tab so it inherits theme styling) ---------- */
  function mountNav() {
    if (document.querySelector('[data-dc-nav]')) return true;
    var tabs = Array.prototype.slice.call(document.querySelectorAll('button,a,[role=tab]'));
    var host = tabs.filter(function (n) { var t = n.textContent.trim(); return /Settings$/.test(t) && t.length < 24; })[0];
    if (!host) return false;
    var btn = host.cloneNode(true);
    Array.prototype.slice.call(btn.attributes).forEach(function (a) {
      if (a.name !== 'class' && a.name !== 'type') btn.removeAttribute(a.name);
    });
    btn.className = btn.className.replace(/\b\S*(active|selected|current)\S*\b/g, '').trim();
    var walker = document.createTreeWalker(btn, NodeFilter.SHOW_TEXT), nodes = [], n;
    while ((n = walker.nextNode())) if (n.nodeValue.trim()) nodes.push(n);
    if (nodes.length) nodes[nodes.length - 1].nodeValue = 'Device Setup';
    if (nodes.length > 1) nodes[0].nodeValue = '\ud83d\udd27';
    btn.setAttribute('data-dc-nav', '1'); btn.setAttribute('title', 'Carrier, SKU, SIM and flashing tools');
    btn.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); open(); });
    host.parentNode.insertBefore(btn, host.nextSibling);
    return true;
  }
  function fab() {
    if (document.querySelector('[data-dc-nav]')) return;
    var b = document.createElement('button'); b.className = 'dc-fab'; b.textContent = 'Device Setup';
    b.setAttribute('data-dc-nav', '1'); b.onclick = open; document.body.appendChild(b);
  }
  function init() {
    if (mountNav()) return;
    var tries = 0, t = setInterval(function () {
      if (mountNav()) clearInterval(t);
      else if (++tries > 10) { clearInterval(t); fab(); }
    }, 300);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  window.addEventListener('keydown', function (e) {           // Ctrl+Shift+D opens the panel too
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'd') { e.preventDefault(); open(); }
  });
})();

</script>
